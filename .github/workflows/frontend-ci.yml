name: Frontend CI

on:
  push:
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set up HeroUI Pro
        run: npx -y hpsetup@latest react --auto
        env:
          HEROUI_KEY: ${{ secrets.HEROUI_KEY }}
      - name: Lint
        run: npm run lint
      - name: Test Skill distribution and installation
        run: npm run test:skills
      - name: Build
        run: npm run build
      - name: Install browser for UI regression tests
        run: npx playwright install --with-deps chromium
      - name: Verify workspace and configuration flows
        env:
          SHOT_BASE: http://127.0.0.1:15178
          SHOT_OUT: /tmp/xunshu-workspace
        run: |
          npm run dev -- --host 127.0.0.1 --port 15178 > /tmp/xunshu-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid"' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS "$SHOT_BASE" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-screenshots
          path: /tmp/xunshu-workspace
          if-no-files-found: ignore
